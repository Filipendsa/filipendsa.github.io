<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Page Not Found | Filipe Nogueira da Silva</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background:
        radial-gradient(circle at 80% 15%, rgba(0, 229, 255, 0.06), transparent 45%),
        radial-gradient(circle at 15% 55%, rgba(16, 185, 129, 0.05), transparent 40%),
        #07090d;
      color: #e6edf3;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 520px;
      padding: 3rem 2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      color: #00e5ff;
      letter-spacing: -0.05em;
      margin-bottom: 1rem;
    }
    h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { color: #9aa4b2; line-height: 1.6; margin-bottom: 2rem; }
    a {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      border-radius: 999px;
      background: #00e5ff;
      color: #07090d;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 229, 255, 0.35); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Route Not Found</h1>
    <p>The requested path does not exist or has been relocated.</p>
    <a href="/">← Return Home</a>
  </main>
</body>
</html>
